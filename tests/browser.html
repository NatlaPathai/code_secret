<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vérifications du navigateur — Code secret</title>
<style>body{font:16px system-ui;color:#183c35;background:#f6f5ee;max-width:1100px;margin:30px auto;padding:0 18px}li{margin:12px 0}iframe{width:100%;height:900px;border:1px solid #ccd4c8;border-radius:12px}a{color:inherit}.fail{color:#a12d2f}</style>
<h1>Vérifications du navigateur</h1><p>Version 0.2.0 · API commune 0.2. Ces essais automatisés complètent la vérification manuelle de l’interface.</p>
<p id="summary" role="status">Vérifications en cours…</p><ol id="results"></ol><a href="../index.html">Retour au jeu</a><div id="host"></div>
<script>
(async()=>{
  const frame=document.createElement('iframe');frame.title='Le jeu testé';
  document.getElementById('host').append(frame);
  const open=url=>new Promise(resolve=>{frame.onload=resolve;frame.src=url;});
  let passed=0,failed=0;
  const check=(name,condition)=>{const li=document.createElement('li');li.textContent=(condition?'Réussi — ':'ÉCHEC — ')+name;if(condition)passed++;else{failed++;li.className='fail';}document.getElementById('results').append(li);};
  const summary=document.getElementById('summary');
  try{
    await open('../index.html');
    check('Sans test=1, window.codeSecretTest est absent.',typeof frame.contentWindow.codeSecretTest==='undefined');
    await open('../index.html?test=1');
    const api=frame.contentWindow.codeSecretTest,d=frame.contentDocument,$=id=>d.getElementById(id);
    check('Mode test : API 0.2, état initial not-started, aucun essai.',api.version==='0.2'&&api.getState().status==='not-started'&&api.getState().attempts===0&&$('counter').textContent==='0 / 10 essais');
    // Les objets sont créés dans la fenêtre du jeu, comme lors d'un appel en console.
    const options=new frame.contentWindow.Object();options.secret=['rouge','rouge','bleu','vert'];
    await api.startGame(options);
    check('Indicateur au démarrage : 0/4 couleurs choisies.',$('selected-count').textContent==='0/4 couleurs choisies');
    const choose=(position,color)=>{const select=$('position-'+position);select.value=color;select.dispatchEvent(new frame.contentWindow.Event('change',{bubbles:true}));};
    choose(1,'rouge');choose(2,'bleu');choose(3,'rouge');
    check('Indicateur après trois choix : 3/4.',$('selected-count').textContent==='3/4 couleurs choisies');
    $('submit').click();await Promise.resolve();
    check('Trois choix dans l’interface : refus visible, zéro essai, historique vide.',api.getState().lastError.code==='invalid-color'&&api.getState().attempts===0&&$('history').children.length===0&&$('error').textContent.length>0&&$('selected-count').textContent==='3/4 couleurs choisies');
    const beforeIncomplete=api.getState();let incomplete=await api.submitGuess(['rouge','bleu','vert']);
    check('Trois couleurs via API : invalid-length, compteur et historique conservés.',incomplete.lastError.code==='invalid-length'&&incomplete.attempts===beforeIncomplete.attempts&&JSON.stringify(incomplete.history)===JSON.stringify(beforeIncomplete.history));
    choose(4,'vert');check('Indicateur après quatre choix : 4/4.',$('selected-count').textContent==='4/4 couleurs choisies');
    choose(2,'');check('Effacer un choix ramène l’indicateur à 3/4.',$('selected-count').textContent==='3/4 couleurs choisies');choose(2,'bleu');
    let state=await api.submitGuess(['rouge','bleu','rouge','vert']);
    check('API vers écran : 2 bien placées, 2 mal placées, 1 essai.',state.lastResult.wellPlaced===2&&state.lastResult.misplaced===2&&$('history').children.length===1&&$('history').textContent.includes('2 bien placée(s)')&&$('history').textContent.includes('2 mal placée(s)')&&$('counter').textContent==='1 / 10 essais');
    const choices=['rouge','rouge','bleu','vert'];choices.forEach((color,i)=>{$('position-'+(i+1)).value=color;});
    $('submit').click();await Promise.resolve();state=api.getState();
    check('Écran vers API : victoire, 2 essais, commandes désactivées.',state.status==='won'&&state.attempts===2&&$('history').children.length===2&&$('submit').disabled&&$('choices').disabled&&$('status').textContent.includes('Code trouvé'));
    const before=JSON.stringify(api.getState());
    try{const invalid=new frame.contentWindow.Object();invalid.secret=null;await api.startGame(invalid);}catch(error){check('Démarrage invalide : erreur normalisée, écran et état conservés.',error.code==='invalid-type'&&JSON.stringify(api.getState())===before&&$('counter').textContent==='2 / 10 essais');}
    await api.submitGuess(null);check('Après la fin, game-finished sans nouvel essai.',api.getState().lastError.code==='game-finished'&&api.getState().attempts===2&&$('history').children.length===2);
    $('new-game').click();await Promise.resolve();
    check('Nouvelle partie à l’écran : API et historique remis à zéro.',api.getState().status==='playing'&&api.getState().attempts===0&&$('history').children.length===0&&$('position-1').value===''&&!$('submit').disabled);
    check('Nouvelle partie remet aussi l’indicateur à 0/4.',$('selected-count').textContent==='0/4 couleurs choisies');
    $('submit').click();await Promise.resolve();check('Saisie incomplète : message visible, aucun essai consommé.',api.getState().lastError.code==='invalid-color'&&api.getState().attempts===0&&$('error').textContent.length>0);
    const red=new frame.contentWindow.Object();red.secret=Array(4).fill('rouge');await api.startGame(red);
    for(let i=0;i<10;i++)await api.submitGuess(Array(4).fill('bleu'));
    check('Défaite : 10 essais à l’écran et commandes désactivées.',api.getState().status==='lost'&&$('history').children.length===10&&$('counter').textContent==='10 / 10 essais'&&$('submit').disabled&&$('status').textContent.includes('épuisés'));
    await api.startGame(red);for(let i=0;i<9;i++)await api.submitGuess(Array(4).fill('bleu'));await api.submitGuess(Array(4).fill('rouge'));
    check('Victoire au dixième : état won et message de victoire.',api.getState().status==='won'&&$('status').textContent.includes('Code trouvé en 10 essais')&&$('history').children.length===10);
    await api.startGame(options);await api.submitGuess(['rouge','bleu','rouge','vert']);
    summary.textContent=`${passed} vérifications réussies ; ${failed} échec(s).`;
    summary.dataset.complete='true';
  }catch(error){summary.textContent='Erreur de vérification : '+error.message;summary.className='fail';summary.dataset.complete='true';}
})();
</script></html>
